<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="t d">
  <title id="t">USB HDMI capture card, both ends</title>
  <desc id="d">Two views of the same small black metal capture card, printed "HDMI Video Capture" on top. One end has the HDMI input and the HDMI output (loop-out). The other end has the blue USB 3.0 port.</desc>
  <rect width="1000" height="800" rx="14" fill="#ffffff"/>

  <!-- ============ END 1: both HDMI ports ============ -->
  <text x="40" y="60" font-family="sans-serif" font-size="22" font-weight="700" fill="#1b1f24">End 1: video in and video out</text>
  <path d="M180 190 L240 140 H660 L600 190 Z" fill="#3b4148" stroke="#16191c" stroke-width="3" stroke-linejoin="round"/>
  <text transform="translate(262 176) skewX(-50)" font-family="sans-serif" font-size="25" font-weight="700" fill="#e8ecef" letter-spacing="1">HDMI Video Capture</text>
  <path d="M600 190 L660 140 V250 L600 300 Z" fill="#23272b" stroke="#16191c" stroke-width="3" stroke-linejoin="round"/>
  <rect x="180" y="190" width="420" height="110" rx="8" fill="#2c3136" stroke="#16191c" stroke-width="3"/>
  <rect x="186" y="196" width="408" height="98" rx="5" fill="none" stroke="#6a727b" stroke-width="2"/>
  <g fill="#14171a" stroke="#6a727b" stroke-width="2"><circle cx="208" cy="218" r="9"/><circle cx="572" cy="218" r="9"/><circle cx="208" cy="276" r="9"/><circle cx="572" cy="276" r="9"/></g>
  <g stroke="#9aa1a8" stroke-width="2"><path d="M202 218 h12 M208 212 v12 M566 218 h12 M572 212 v12 M202 276 h12 M208 270 v12 M566 276 h12 M572 270 v12"/></g>
  <!-- HDMI INPUT -->
  <path d="M225 218 H325 V243 L313 258 H237 L225 243 Z" fill="#101214" stroke="#aab0b6" stroke-width="3"/>
  <rect x="242" y="230" width="66" height="8" fill="#c8ccd0"/>
  <text x="275" y="280" font-family="sans-serif" font-size="12" font-weight="700" fill="#cfd5db" text-anchor="middle" letter-spacing="1">HDMI INPUT</text>
  <!-- HDMI OUTPUT -->
  <path d="M455 218 H555 V243 L543 258 H467 L455 243 Z" fill="#101214" stroke="#aab0b6" stroke-width="3"/>
  <rect x="472" y="230" width="66" height="8" fill="#c8ccd0"/>
  <text x="505" y="280" font-family="sans-serif" font-size="12" font-weight="700" fill="#cfd5db" text-anchor="middle" letter-spacing="1">HDMI OUTPUT</text>
  <!-- callouts -->
  <g stroke="#d6332f" stroke-width="3" fill="#d6332f">
    <line x1="275" y1="300" x2="275" y2="335"/><circle cx="275" cy="300" r="5"/>
    <line x1="505" y1="300" x2="505" y2="335"/><circle cx="505" cy="300" r="5"/>
  </g>
  <g font-family="sans-serif" fill="#1b1f24" text-anchor="middle">
    <text x="250" y="362" font-size="19" font-weight="700">HDMI INPUT</text><text x="250" y="384" font-size="15">cable from the TARGET</text>
    <text x="520" y="362" font-size="19" font-weight="700">HDMI OUTPUT (loop-out)</text><text x="520" y="384" font-size="15">to a monitor (optional)</text>
  </g>

  <!-- ============ END 2: USB ============ -->
  <text x="40" y="440" font-family="sans-serif" font-size="22" font-weight="700" fill="#1b1f24">End 2: to the node</text>
  <path d="M180 570 L240 520 H660 L600 570 Z" fill="#3b4148" stroke="#16191c" stroke-width="3" stroke-linejoin="round"/>
  <text transform="translate(262 556) skewX(-50)" font-family="sans-serif" font-size="25" font-weight="700" fill="#e8ecef" letter-spacing="1">HDMI Video Capture</text>
  <path d="M600 570 L660 520 V630 L600 680 Z" fill="#23272b" stroke="#16191c" stroke-width="3" stroke-linejoin="round"/>
  <rect x="180" y="570" width="420" height="110" rx="8" fill="#2c3136" stroke="#16191c" stroke-width="3"/>
  <rect x="186" y="576" width="408" height="98" rx="5" fill="none" stroke="#6a727b" stroke-width="2"/>
  <g fill="#14171a" stroke="#6a727b" stroke-width="2"><circle cx="208" cy="598" r="9"/><circle cx="572" cy="598" r="9"/><circle cx="208" cy="656" r="9"/><circle cx="572" cy="656" r="9"/></g>
  <g stroke="#9aa1a8" stroke-width="2"><path d="M202 598 h12 M208 592 v12 M566 598 h12 M572 592 v12 M202 656 h12 M208 650 v12 M566 656 h12 M572 650 v12"/></g>
  <!-- USB 3.0 -->
  <rect x="336" y="600" width="108" height="42" rx="3" fill="#101214" stroke="#aab0b6" stroke-width="3"/>
  <rect x="348" y="615" width="84" height="12" fill="#2f6fd0"/>
  <text x="390" y="662" font-family="sans-serif" font-size="12" font-weight="700" fill="#cfd5db" text-anchor="middle" letter-spacing="1">USB 3.0</text>
  <g stroke="#d6332f" stroke-width="3" fill="#d6332f"><line x1="390" y1="680" x2="390" y2="715"/><circle cx="390" cy="680" r="5"/></g>
  <g font-family="sans-serif" fill="#1b1f24" text-anchor="middle">
    <text x="390" y="742" font-size="19" font-weight="700">USB 3.0</text><text x="390" y="764" font-size="15">cable to the NODE</text>
  </g>
  <text x="500" y="790" font-family="sans-serif" font-size="13" fill="#5f6b7a" text-anchor="middle">Illustration only, not to scale. Layout and labels vary between cards; some also have audio jacks. It must show up as a standard camera (UVC).</text>
</svg>
