<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">How MCPing, the capture card, ESP32 board, target and monitor connect</title>
  <desc id="d">The MCPing laptop has the capture card on a USB 3.0 port and the ESP32 board's UART port on another USB port, plus Ethernet to the network. The target computer's HDMI output goes to the capture card's HDMI input. The capture card's HDMI output goes to an optional monitor. The ESP32 board's USB port goes to a USB port on the target.</desc>
  <rect width="1200" height="760" rx="14" fill="#ffffff"/>

  <!-- ===== DEVICE laptop ===== -->
  <rect x="60" y="200" width="260" height="170" rx="9" fill="#3a4350" stroke="#1f252d" stroke-width="3"/>
  <rect x="72" y="212" width="236" height="146" fill="#9db3c8"/>
  <text x="190" y="272" font-family="sans-serif" font-size="22" font-weight="700" fill="#1b1f24" text-anchor="middle">MCPing</text>
  <text x="190" y="298" font-family="sans-serif" font-size="14" fill="#1b1f24" text-anchor="middle">Linux laptop or desktop</text>
  <text x="190" y="320" font-family="sans-serif" font-size="14" fill="#1b1f24" text-anchor="middle">runs the MCP server</text>
  <path d="M30 370 H350 L336 424 H44 Z" fill="#c9ced3" stroke="#6b7480" stroke-width="3" stroke-linejoin="round"/>
  <!-- ports on the device (right edge) -->
  <rect x="346" y="378" width="18" height="12" rx="2" fill="#2f6fd0" stroke="#16191c" stroke-width="2"/>
  <rect x="340" y="402" width="18" height="12" rx="2" fill="#aab0b6" stroke="#16191c" stroke-width="2"/>
  <!-- Ethernet port (left edge) -->
  <rect x="26" y="394" width="16" height="14" rx="2" fill="#d4a017" stroke="#16191c" stroke-width="2"/>

  <!-- ===== Router ===== -->
  <rect x="60" y="610" width="200" height="60" rx="8" fill="#e6e9ee" stroke="#6b7480" stroke-width="3"/>
  <text x="160" y="636" font-family="sans-serif" font-size="18" font-weight="700" fill="#1b1f24" text-anchor="middle">Router / network</text>
  <text x="160" y="656" font-family="sans-serif" font-size="13" fill="#1b1f24" text-anchor="middle">where the AI client connects from</text>

  <!-- ===== CAPTURE CARD ===== -->
  <rect x="520" y="120" width="190" height="78" rx="6" fill="#2c3136" stroke="#16191c" stroke-width="3"/>
  <text x="612" y="152" font-family="sans-serif" font-size="14" font-weight="700" fill="#e8ecef" text-anchor="middle">HDMI Video Capture</text>
  <text x="615" y="176" font-family="sans-serif" font-size="13" fill="#cfd5db" text-anchor="middle">USB capture card</text>
  <rect x="508" y="150" width="14" height="14" rx="2" fill="#2f6fd0" stroke="#16191c" stroke-width="2"/>
  <rect x="708" y="132" width="16" height="14" rx="2" fill="#aab0b6" stroke="#16191c" stroke-width="2"/>
  <rect x="708" y="168" width="16" height="14" rx="2" fill="#aab0b6" stroke="#16191c" stroke-width="2"/>
  <text x="702" y="143" font-family="sans-serif" font-size="11" fill="#cfd5db" text-anchor="end">OUT</text>
  <text x="702" y="179" font-family="sans-serif" font-size="11" fill="#cfd5db" text-anchor="end">IN</text>

  <!-- ===== ESP32 board ===== -->
  <rect x="580" y="420" width="220" height="86" rx="6" fill="#1c1f22" stroke="#0b0c0d" stroke-width="3"/>
  <rect x="660" y="432" width="110" height="62" fill="#b8bec5" stroke="#7d848c" stroke-width="2"/>
  <text x="715" y="468" font-family="sans-serif" font-size="12" fill="#3a4047" text-anchor="middle">ESP32-S3</text>
  <text x="695" y="410" font-family="sans-serif" font-size="16" font-weight="700" fill="#1b1f24" text-anchor="middle">ESP32-S3 board</text>
  <text x="695" y="528" font-family="sans-serif" font-size="13" fill="#1b1f24" text-anchor="middle">keyboard + mouse for the target</text>
  <rect x="566" y="434" width="18" height="22" rx="4" fill="#cfd4d9" stroke="#6b7480" stroke-width="2"/>
  <rect x="566" y="468" width="18" height="22" rx="4" fill="#cfd4d9" stroke="#6b7480" stroke-width="2"/>
  <text x="592" y="450" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">UART</text>
  <text x="592" y="484" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">USB</text>

  <!-- ===== TARGET laptop ===== -->
  <rect x="900" y="400" width="240" height="150" rx="9" fill="#3a4350" stroke="#1f252d" stroke-width="3"/>
  <rect x="912" y="412" width="216" height="126" fill="#c6d3df"/>
  <text x="1020" y="470" font-family="sans-serif" font-size="22" font-weight="700" fill="#1b1f24" text-anchor="middle">TARGET</text>
  <text x="1020" y="494" font-family="sans-serif" font-size="14" fill="#1b1f24" text-anchor="middle">the computer to operate</text>
  <path d="M880 550 H1160 L1146 596 H894 Z" fill="#c9ced3" stroke="#6b7480" stroke-width="3" stroke-linejoin="round"/>
  <rect x="882" y="556" width="16" height="12" rx="2" fill="#aab0b6" stroke="#16191c" stroke-width="2"/>
  <rect x="888" y="576" width="16" height="12" rx="2" fill="#cfd4d9" stroke="#16191c" stroke-width="2"/>
  <text x="1020" y="620" font-family="sans-serif" font-size="12" fill="#5f6b7a" text-anchor="middle">HDMI output (top port)   USB port (bottom port)</text>

  <!-- ===== MONITOR (optional) ===== -->
  <rect x="900" y="60" width="240" height="140" rx="8" fill="#3a4350" stroke="#1f252d" stroke-width="3"/>
  <rect x="912" y="72" width="216" height="110" fill="#c6d3df"/>
  <text x="1020" y="124" font-family="sans-serif" font-size="20" font-weight="700" fill="#1b1f24" text-anchor="middle">MONITOR (Optional)</text>
  <text x="1020" y="148" font-family="sans-serif" font-size="13" fill="#1b1f24" text-anchor="middle">lets a person</text><text x="1020" y="166" font-family="sans-serif" font-size="13" fill="#1b1f24" text-anchor="middle">see the same picture</text>
  <rect x="1000" y="200" width="40" height="14" fill="#6b7480"/><rect x="975" y="214" width="90" height="8" rx="3" fill="#6b7480"/>
  <rect x="884" y="134" width="16" height="14" rx="2" fill="#aab0b6" stroke="#16191c" stroke-width="2"/>

  <!-- ===== CABLES ===== -->
  <g fill="none" stroke-width="7" stroke-linecap="round">
    <!-- capture card USB 3.0 -> device USB 3.0 port -->
    <path d="M508 157 C 440 157, 420 384, 364 384" stroke="#2f6fd0"/>
    <!-- ESP32 UART port -> device USB port -->
    <path d="M566 445 C 480 445, 430 408, 358 408" stroke="#2e9e5b"/>
    <!-- target HDMI out -> capture card HDMI IN -->
    <path d="M882 562 C 800 562, 790 175, 724 175" stroke="#1b1f24"/>
    <!-- capture card HDMI OUT -> monitor -->
    <path d="M724 139 C 800 139, 810 141, 884 141" stroke="#6b7480"/>
    <!-- ESP32 USB port -> target USB port -->
    <path d="M566 479 C 520 640, 800 660, 888 582" stroke="#e07b00"/>
    <!-- Ethernet device -> router -->
    <path d="M26 401 C -10 480, 40 560, 120 610" stroke="#d4a017"/>
  </g>

  <!-- ===== CABLE LABELS ===== -->
  <g font-family="sans-serif" font-size="14" fill="#1b1f24">
    <text x="458" y="236" font-weight="700">USB 3.0 cable</text><text x="458" y="254">capture card to MCPing</text>
    <text x="372" y="486" font-weight="700">USB-C data cable</text><text x="372" y="504">UART port to MCPing</text>
    <text x="832" y="296" font-weight="700">HDMI cable</text><text x="832" y="314">TARGET video out</text><text x="832" y="332">to the card's HDMI IN</text>
    <text x="736" y="86" font-weight="700">HDMI cable</text><text x="736" y="104">card OUT to the monitor</text>
    <text x="600" y="660" font-weight="700">USB-C data cable</text><text x="600" y="678">USB port to the TARGET</text>
    <text x="62" y="520" font-weight="700">Ethernet</text><text x="62" y="538">(recommended)</text>
  </g>

  <text x="600" y="728" font-family="sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">Illustration only, not to scale. Port positions vary. Both USB-C ports on the ESP32-S3 board are on the same end; use real data cables, not charge-only.</text>
</svg>
